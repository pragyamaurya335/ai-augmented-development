<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Connection Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
        }

        th {
            background-color: #334155;
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:nth-child(even) {
            background-color: #1e293b;
        }

        tr:nth-child(odd) {
            background-color: #162032;
        }

        tr:hover {
            background-color: #273549;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .badge-pending {
            background-color: rgba(234, 179, 8, 0.2);
            color: #facc15;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚀 Git Connection Test</h1>
        <p>Sample HTML table document to verify repository commits and pushes.</p>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Local Repository</td>
                    <td><span class="badge badge-success">Initialized</span></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Git Remote</td>
                    <td><span class="badge badge-pending">Testing</span></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>First Commit</td>
                    <td><span class="badge badge-success">Ready</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
